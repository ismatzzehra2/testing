<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSOI – Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">ROSOI</h1>
            <p class="tagline">Skardu</p>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>Welcome to ROSOI</h2>
                <p>Authentic flavors, minimalist space.</p>
            </div>
        </section>

        <section class="info">
            <div class="container">
                <div class="card">
                    <h3>Owner</h3>
                    <p>Zafar</p>
                </div>
                <div class="card">
                    <h3>Phone</h3>
                    <p><a href="tel:+923436847475">0343 6847475</a></p>
                </div>
                <div class="card">
                    <h3>Location</h3>
                    <p>Skardu, Pakistan</p>
                </div>
            </div>
        </section>

        <section class="hours">
            <div class="container">
                <h2>Hours</h2>
                <p id="status">Loading…</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 ROSOI &middot; Skardu</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
